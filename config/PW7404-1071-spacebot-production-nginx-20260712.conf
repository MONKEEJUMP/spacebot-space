# SpaceBot.Space - Primary Domain
# PW7404-1071 preserves the active configuration and denies public AgentScope.

server {
    server_name spacebot.space www.spacebot.space;

    client_max_body_size 10M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://clerk.spacebot.space https://*.clerk.accounts.dev https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://fonts.googleapis.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.cerebras.ai https://*.tavily.com https://*.supabase.co https://*.clerk.accounts.dev https://clerk.spacebot.space https://cdnjs.cloudflare.com; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; frame-ancestors 'none';" always;

    location = /about { return 301 /sanctuary; }

    # AgentScope is an internal loopback dependency. Never proxy it publicly.
    location = /api/agentscope { return 404; }
    location ^~ /api/agentscope/ { return 404; }

    # Internal LUCY transport is service-to-service only. Public humans and
    # resident agents enter through /api/chat, which invokes the same coordinator.
    location = /api/internal/lucy/v1/cycles {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        if ($http_upgrade != "") { return 426; }
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/spacebot.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spacebot.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name spacebot.space www.spacebot.space;
    return 301 https://spacebot.space$request_uri;
}
